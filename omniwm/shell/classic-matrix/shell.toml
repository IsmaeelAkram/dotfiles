# Classic Matrix: the classic bar (see ../classic/shell.toml) in the Matrix style, rain background included.
# lib/ and shaders/ are symlinks into ../matrix, so this follows Matrix style updates.
# Colours match the top bar (wallpaper theme). Height is 30, not 24: Matrix sizes everything for a
# 40pt bar, so 30 gives classic's text size and fits Matrix's numbered workspace boxes.
# Switch with: omniwmctl shell profile classic-matrix
theme = "wallpaper"
scheme = "tonalSpot"
leading = []
center = ["workspaces"]
trailing = []

[barShader]
source = "matrix-rain.metal"
fps = 30
values = [0.38, 1, 12, 1]

[widgets.workspaces]
indicator = "numbers"

[workspaceBar]
position = "bottom"
fullWidth = false
reserveLayoutSpace = false
height = 30
backgroundOpacity = 1
barFill = "background"
transparentBackground = false
solidBlackBackground = false
showItemBackgrounds = false
showAccentHighlights = true
showLabels = true
systemStatsButton = false
xOffset = 0
yOffset = 0
